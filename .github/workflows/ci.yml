name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install torch (CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install ruff and pytest
        run: python -m pip install ruff pytest
      - name: Ruff
        run: ruff check .
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation -w dist
      - name: Test installed wheel from neutral directory
        run: |
          python -m venv /tmp/fse-test --system-site-packages
          /tmp/fse-test/bin/pip install dist/*.whl
          cp -r tests /tmp/fse-tests
          cd /tmp
          /tmp/fse-test/bin/python -m pytest -q /tmp/fse-tests
